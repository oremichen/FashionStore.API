<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account status changed</title></head>
<body style="margin:0;background:#f5f5f5;font-family:Arial,sans-serif;color:#222">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td align="center" style="padding:32px 16px">
    <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;background:#fff;border-radius:8px">
      <tr><td align="center" style="padding:28px"><img src="{{logoUrl}}" alt="{{appName}}" style="max-width:180px"></td></tr>
      <tr><td style="padding:0 32px 32px">
        <h2 style="margin-top:0">Account status changed</h2>
        <p>Hello {{username}},</p>
        <p>The account <strong>{{email}}</strong> has been <strong>{{status}}</strong> on {{appName}}.</p>
        <p>If you believe this was done in error, please contact a SuperAdmin.</p>
        <p style="margin-top:32px;color:#777;font-size:12px">&copy; {{year}} {{appName}}</p>
      </td></tr>
    </table>
  </td></tr></table>
</body>
</html>
