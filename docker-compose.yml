services:
  # Uncomment this service and the api depends_on block to use local PostgreSQL.
  # fashionstoredb:
  #   image: postgres:17
  #   container_name: fashionstore-postgres
  #   restart: unless-stopped
  #   command: ["postgres", "-p", "5433"]
  #   environment:
  #     POSTGRES_DB: FashionStoreDb
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: "1234"
  #     PGDATA: /var/lib/postgresql/data/pgdata
  #   ports:
  #     - "5433:5433"
  #   volumes:
  #     - postgres-fashionstoredb:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -h localhost -p 5433 -U postgres -d FashionStoreDb"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 12
  #     start_period: 10s

  api:
    container_name: fashionstore-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: FashionStore.API/Dockerfile
    # Uncomment this block when using the local PostgreSQL service.
    # depends_on:
    #   fashionstoredb:
    #     condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      ASPNETCORE_URLS: "http://+:8080"
      # To use local PostgreSQL, comment out the cloud setting below and
      # uncomment this local connection string:
      # ConnectionStrings__DefaultConnection: "Host=fashionstoredb;Port=5433;Database=FashionStoreDb;Username=postgres;Password=1234;Include Error Detail=true"
      ConnectionStrings__DefaultConnection: "${CLOUD_DATABASE_URL:?CLOUD_DATABASE_URL is required}"
    ports:
      - "8080:8080"

# Uncomment when using the local PostgreSQL service.
# volumes:
#   postgres-fashionstoredb:
